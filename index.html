<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keramický klub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f6efe8;
  color: #3d3028;
}

.container {
  max-width: 600px;
  margin: 40px auto;
  padding: 30px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

h1 {
  text-align: center;
  font-size: 34px;
}

.intro {
  text-align: center;
  color: #75665c;
}

.price {
  background: #eee0d3;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  margin: 25px 0;
  font-weight: bold;
}

.term {
  border: 1px solid #ddd0c5;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 12px;
}

.term strong {
  display: block;
  font-size: 18px;
  margin-bottom: 5px;
}

.free {
  color: #75665c;
}

button {
  width: 100%;
  margin-top: 10px;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: #8b634b;
  color: white;
  font-size: 15px;
  cursor: pointer;
}

button:hover {
  background: #704b37;
}

button:disabled {
  background: #aaa;
  cursor: not-allowed;
}

#formular {
  display: none;
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #ddd;
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 8px;
  font-size: 16px;
}

#sprava {
  text-align: center;
  margin-top: 15px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Keramický klub</h1>

<p class="intro">
Vyberte si termín a rezervujte si svoje miesto.
</p>

<div class="price">
Cena: 7 € / osoba<br>
Maximálne 10 osôb na termín
</div>

<div id="terminy"></div>

<div id="formular">

<h2>Rezervácia</h2>

<p id="vybranyTermin"></p>

<form id="rezervacia">

<label>Meno a priezvisko</label>
<input id="meno" required>

<label>Telefónne číslo</label>
<input id="telefon" type="tel" required>

<label>E-mail</label>
<input id="email" type="email" required>

<button type="submit">
Potvrdiť rezerváciu
</button>

</form>

<div id="sprava"></div>

</div>

</div>

<script>

const terminy = [
  "1. október",
  "15. október",
  "29. október",
  "12. november",
  "26. november",
  "10. december"
];

const pocetMiest = {};

terminy.forEach(termin => {
  pocetMiest[termin] = 10;
});

let vybranyTermin = "";

const terminyDiv = document.getElementById("terminy");

function zobrazTerminy() {

  terminyDiv.innerHTML = "";

  terminy.forEach(termin => {

    const volne = pocetMiest[termin];

    const div = document.createElement("div");
    div.className = "term";

    div.innerHTML = `
      <strong>${termin}</strong>
      <span class="free">
        ${volne} / 10 miest voľných
      </span>
      <button
        ${volne === 0 ? "disabled" : ""}
        onclick="vyberTermin('${termin}')">
        ${volne === 0 ? "Obsadené" : "Rezervovať miesto"}
      </button>
    `;

    terminyDiv.appendChild(div);
  });
}

function vyberTermin(termin) {

  vybranyTermin = termin;

  document.getElementById("formular").style.display = "block";

  document.getElementById("vybranyTermin").innerHTML =
    "<strong>Vybraný termín:</strong> " + termin;

  document.getElementById("formular")
    .scrollIntoView({ behavior: "smooth" });
}

document.getElementById("rezervacia")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const sprava = document.getElementById("sprava");

  sprava.innerHTML = "Odosielam rezerváciu...";

  const data = {
    name: document.getElementById("meno").value,
    phone: document.getElementById("telefon").value,
    email: document.getElementById("email").value,
    date: vybranyTermin
  };

  try {

    const response = await fetch("/api/reservations", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(data)

    });

    const result = await response.json();

    if (result.success) {

      pocetMiest[vybranyTermin]--;

      zobrazTerminy();

      document.getElementById("rezervacia").reset();

      document.getElementById("formular").style.display = "none";

      sprava.innerHTML =
        "✅ Rezervácia bola úspešne odoslaná.";

    } else {

      sprava.innerHTML =
        "❌ " + (result.error || "Nastala chyba.");

    }

  } catch (error) {

    sprava.innerHTML =
      "❌ Nepodarilo sa spojiť so serverom.";

  }

});

zobrazTerminy();

</script>

</body>
</html>
