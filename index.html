<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemerský folklôrny festival Tejdová</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .social-box {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            text-align: center;
            min-width: 320px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            padding: 14px;
            border-radius: 30px;
            font-size: 18px;
            margin: 12px 0;
            transition: 0.3s;
        }

        .social-link:hover {
            transform: scale(1.05);
        }

        .instagram {
            background: #E1306C;
        }

        .instagram:hover {
            background: #C13584;
        }

        .facebook {
            background: #1877F2;
        }

        .facebook:hover {
            background: #166FE5;
        }

        .social-link i {
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="social-box">
    <h1>Naše sociálne siete</h1>

    <a class="social-link instagram"
       href="https://www.instagram.com/gff_rejdova/"
       target="_blank">
        <i class="fab fa-instagram"></i>
        Instagram
    </a>

    <a class="social-link facebook"
       href="https://www.facebook.com/GFFRejdova"
       target="_blank">
        <i class="fab fa-facebook-f"></i>
        Facebook
    </a>
</div>

</body>
</html>
