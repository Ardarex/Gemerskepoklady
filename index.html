<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prekvapenie 🫶</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#ff9ec4,#ffd6e8);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

.container{
    text-align:center;
}

#start{
    padding:18px 40px;
    font-size:24px;
    border:none;
    border-radius:15px;
    background:#ff2d75;
    color:white;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

#start:hover{
    transform:scale(1.1);
}

#content{
    display:none;
}

h1{
    font-size:55px;
    color:white;
    text-shadow:2px 2px 10px rgba(0,0,0,.3);
    animation:pop 1s;
}

p{
    margin-top:30px;
    color:white;
    font-size:22px;
}

.buttons{
    margin-top:20px;
}

.buttons button{
    padding:12px 28px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin:10px;
}

#yes{
    background:#28a745;
    color:white;
}

#no{
    background:#dc3545;
    color:white;
    position:absolute;
}

.hand{
    position:absolute;
    font-size:35px;
    animation:fly 3s linear forwards;
    pointer-events:none;
}

@keyframes pop{
    from{
        transform:scale(0);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

@keyframes fly{
    from{
        transform:translateY(0) scale(1);
        opacity:1;
    }
    to{
        transform:translateY(-120vh) scale(2);
        opacity:0;
    }
}
</style>

</head>
<body>

<div class="container">

<button id="start">Stlač 🫶</button>

<div id="content">

<h1>
🫶<br>
Si frajerka!<br>
Gratulujem,<br>
zaslúžene si frajerka!
</h1>

<p>Dnes vyqapkuj ma post</p>

<div class="buttons">
<button id="yes">Áno</button>
<button id="no">Nie</button>
</div>

</div>

</div>

<script>

const start=document.getElementById("start");
const content=document.getElementById("content");
const no=document.getElementById("no");
const yes=document.getElementById("yes");

function hands(count){

    for(let i=0;i<count;i++){

        setTimeout(()=>{

            const hand=document.createElement("div");
            hand.className="hand";
            hand.innerHTML="🫶";
            hand.style.left=Math.random()*100+"vw";
            hand.style.top="100vh";
            hand.style.fontSize=(25+Math.random()*30)+"px";

            document.body.appendChild(hand);

            setTimeout(()=>{
                hand.remove();
            },3000);

        },i*30);

    }

}

start.onclick=()=>{

    start.style.display="none";
    content.style.display="block";

    hands(100);

    no.style.left=(window.innerWidth/2+100)+"px";
    no.style.top=(window.innerHeight/2+170)+"px";

};

function moveNo(){

    const x=Math.random()*(window.innerWidth-120);
    const y=Math.random()*(window.innerHeight-80);

    no.style.left=x+"px";
    no.style.top=y+"px";

}

no.addEventListener("mouseenter",moveNo);
no.addEventListener("click",moveNo);

yes.onclick=()=>{

    hands(180);

};

</script>

</body>
</html>
