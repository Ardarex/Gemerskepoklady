<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rezervačný systém GOS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #302923;
      background:
        radial-gradient(circle at top left, #f4e5d5 0%, transparent 35%),
        radial-gradient(circle at bottom right, #ead7c7 0%, transparent 35%),
        #f8f5f1;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image:
        radial-gradient(#8b7564 0.6px, transparent 0.6px);
      background-size: 18px 18px;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 42px 18px 60px;
    }

    /* HLAVIČKA */

    .hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(111, 91, 76, 0.15);
      box-shadow: 0 6px 20px rgba(71, 52, 39, 0.06);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #806957;
    }

    .hero-badge span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9b6d50;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 52px);
      line-height: 1.05;
      letter-spacing: -1.5px;
      font-weight: 800;
      color: #302923;
    }

    .intro {
      max-width: 520px;
      margin: 16px auto 0;
      font-size: 16px;
      line-height: 1.6;
      color: #74665c;
    }

    /* PRIHLÁSENIE */

    .auth-box {
      margin-bottom: 18px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(111, 91, 76, 0.14);
      box-shadow:
        0 10px 28px rgba(72, 53, 40, 0.06),
        0 2px 8px rgba(72, 53, 40, 0.04);
    }

    .auth-status {
      text-align: center;
      color: #74665c;
      font-size: 14px;
      line-height: 1.5;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .auth-button {
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      background: #352c27;
      color: white;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-button.secondary {
      background: #eadfd6;
      color: #5d4738;
    }

    .auth-button:hover {
      opacity: 0.9;
    }

    .auth-form {
      display: none;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee4dc;
    }

    .auth-form.show {
      display: block;
    }

    .auth-form input {
      width: 100%;
      padding: 12px 14px;
      margin-top: 8px;
      margin-bottom: 12px;
      border: 1px solid #d9ccc2;
      border-radius: 10px;
      background: white;
      color: #302923;
      font-family: inherit;
      font-size: 16px;
      outline: none;
    }

    .auth-form input:focus {
      border-color: #9b6d50;
      box-shadow: 0 0 0 4px rgba(155, 109, 80, 0.10);
    }

    .auth-message {
      margin-top: 10px;
      text-align: center;
      color: #72533f;
      font-size: 13px;
      font-weight: 700;
    }

    /* SEKCIE */

    .section {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(111, 91, 76, 0.14);
      border-radius: 22px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow:
        0 12px 35px rgba(72, 53, 40, 0.07),
        0 2px 8px rgba(72, 53, 40, 0.04);
      backdrop-filter: blur(8px);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .section:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 42px rgba(72, 53, 40, 0.10),
        0 3px 10px rgba(72, 53, 40, 0.05);
    }

    .section-header {
      min-height: 78px;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      font-size: 20px;
      font-weight: 700;
      color: #352c27;
      transition: background 0.2s ease;
    }

    .section-header:hover {
      background: #fbf8f5;
    }

    .section-header::before {
      content: "";
      width: 5px;
      height: 28px;
      border-radius: 10px;
      background: #9b6d50;
      margin-right: 14px;
    }

    .section-header span:first-child {
      flex: 1;
    }

    .arrow {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f2ebe5;
      color: #755540;
      font-size: 14px;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .section-header:hover .arrow {
      background: #e9ddd4;
    }

    .section-content {
      display: none;
      padding: 0 22px 24px;
      animation: fadeIn 0.25s ease;
    }

    .section-content.show {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* KLUB */

    .section-content > p {
      color: #74665c;
      line-height: 1.6;
    }

    .section-content > p:first-child {
      margin-top: 0;
      font-size: 15px;
    }

    .section-content > p:nth-child(2) {
      margin-bottom: 18px;
    }

    .term {
      background: #fcfaf8;
      border: 1px solid #eadfd7;
      border-radius: 16px;
      padding: 17px;
      margin: 10px 0;
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.2s ease;
    }

    .term:hover {
      border-color: #c6aa94;
      background: #fffdfb;
      transform: translateY(-1px);
    }

    .term.selected {
      border: 2px solid #9b6d50;
      background: #fffdfb;
      box-shadow: 0 7px 20px rgba(93, 64, 45, 0.08);
    }

    .term > strong {
      font-size: 16px;
      color: #3b3029;
    }

    .availability {
      margin-top: 6px;
      font-size: 13px;
      color: #8a786b;
    }

    .times {
      display: none;
      margin-top: 18px;
      padding-top: 17px;
      border-top: 1px solid #eee4dc;
    }

    .times.show {
      display: block;
    }

    .times > strong {
      font-size: 14px;
      color: #55463c;
    }

    .time-row {
      margin-top: 14px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #594a40;
    }

    select,
    input[type="text"],
    input[type="tel"],
    input[type="email"] {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d9ccc2;
      border-radius: 11px;
      background: #fff;
      color: #302923;
      font-family: inherit;
      font-size: 16px;
      outline: none;
      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    select:focus,
    input[type="text"]:focus,
    input[type="tel"]:focus,
    input[type="email"]:focus {
      border-color: #9b6d50;
      box-shadow: 0 0 0 4px rgba(155, 109, 80, 0.10);
    }

    select:disabled {
      color: #aaa;
      background: #f3f1ef;
    }

    .selected-time {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 10px;
      background: #f2ebe5;
      color: #73543f;
      font-size: 14px;
      font-weight: 700;
    }

    /* KURZ */

    .course-info {
      position: relative;
      padding: 20px;
      margin-bottom: 17px;
      border-radius: 16px;
      background:
        linear-gradient(135deg, #f7eee7, #fcf8f4);
      border: 1px solid #eadbd0;
      line-height: 1.8;
    }

    .course-info div {
      color: #66564c;
      font-size: 15px;
    }

    .course-info strong {
      color: #3d322b;
    }

    .course-place {
      margin-top: 13px !important;
      padding-top: 13px;
      border-top: 1px solid #e5d8ce;
    }

    #courseAvailability {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: #eadfd6;
      color: #72533e;
      font-size: 13px;
      font-weight: 700;
    }

    .course-button {
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 12px;
      background: #352c27;
      color: white;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(53, 44, 39, 0.16);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .course-button:hover:not(:disabled) {
      transform: translateY(-2px);
      background: #493b33;
      box-shadow: 0 12px 25px rgba(53, 44, 39, 0.20);
    }

    .course-button:active:not(:disabled) {
      transform: translateY(0);
    }

    .course-button:disabled {
      background: #aaa;
      cursor: not-allowed;
      box-shadow: none;
    }
